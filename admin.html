<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de administración | Barbería City</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body { padding: 30px 20px; max-width: 1000px; margin: 0 auto; }
  .admin-header { display:flex; justify-content:space-between; align-items:center; margin-bottom: 30px; flex-wrap: wrap; gap: 12px;}
  table { width:100%; border-collapse: collapse; margin-top: 16px; }
  th, td { text-align:left; padding: 10px 8px; border-bottom: 1px solid var(--borde); font-size:0.9rem; }
  th { color: var(--gris); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.04em; }
  tr.cancelado { opacity: 0.4; }
  .tag { padding: 2px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
  .tag.confirmado { background: var(--amarillo); color: var(--negro); }
  .tag.cancelado { background: var(--borde); color: var(--gris); }
  .tabs { display:flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
  .tab-btn { background: var(--negro-2); border: 1px solid var(--borde); color: var(--blanco); padding: 10px 18px; border-radius: 6px; cursor: pointer; }
  .tab-btn.activo { background: var(--amarillo); color: var(--negro); border-color: var(--amarillo); }
  .panel-admin { display:none; }
  .panel-admin.activo { display:block; }
  .fila-horario { display:grid; grid-template-columns: 100px 1fr 1fr 1fr 90px; gap: 10px; align-items:center; margin-bottom: 10px; }
  .fila-horario input[type="time"] { background: var(--negro); border:1px solid var(--borde); color: var(--blanco); padding: 8px; border-radius:6px; width:100%; }
  .login-box { max-width: 360px; margin: 100px auto; text-align:center; }
  .login-box input { margin-bottom: 16px; }
  .btn-mini { padding: 8px 14px; font-size: 0.8rem; }
  form.inline { display:flex; gap:10px; flex-wrap:wrap; align-items:end; margin-bottom: 24px; }
  form.inline > div { display:flex; flex-direction:column; gap:6px; }
  form.inline label { font-size:0.75rem; color:var(--gris); text-transform:uppercase; }
</style>
</head>
<body>

<div id="login" class="login-box">
  <h1 style="margin-bottom:20px;">Panel <span style="color:var(--amarillo)">Admin</span></h1>
  <input type="password" id="passwordInput" placeholder="Contraseña de administrador">
  <button class="btn btn-primario btn-block" id="btnLogin">Ingresar</button>
  <p id="loginError" style="color:#ff9d9d; margin-top:14px;"></p>
</div>

<div id="panel" style="display:none;">
  <div class="admin-header">
    <h1>BARBERÍA <span style="color:var(--amarillo)">CITY</span> — Admin</h1>
  </div>

  <div class="tabs">
    <button class="tab-btn activo" data-tab="reservas">Reservas</button>
    <button class="tab-btn" data-tab="bloqueos">Bloquear horarios</button>
    <button class="tab-btn" data-tab="horarios">Configurar horarios</button>
  </div>

  <!-- RESERVAS -->
  <section class="panel-admin activo" id="tab-reservas">
    <button class="btn btn-secundario btn-mini" id="btnRefrescar">Actualizar lista</button>
    <table>
      <thead>
        <tr><th>Fecha</th><th>Hora</th><th>Servicio</th><th>Barba</th><th>Cliente</th><th>WhatsApp</th><th>Estado</th><th></th></tr>
      </thead>
      <tbody id="tablaReservas"></tbody>
    </table>
  </section>

  <!-- BLOQUEOS -->
  <section class="panel-admin" id="tab-bloqueos">
    <p style="color:var(--gris); margin-bottom:20px;">Bloqueá un día completo o un horario puntual (ej: turno médico, feriado, etc).</p>
    <form class="inline" id="formBloqueo">
      <div>
        <label>Fecha</label>
        <input type="date" id="bloqueoFecha" required>
      </div>
      <div>
        <label>Hora (opcional — vacío = todo el día)</label>
        <input type="time" id="bloqueoHora">
      </div>
      <div>
        <label>Motivo (opcional)</label>
        <input type="text" id="bloqueoMotivo" placeholder="Ej: Feriado">
      </div>
      <button class="btn btn-primario" type="submit">Bloquear</button>
    </form>
    <div id="bloqueoMsg"></div>
  </section>

  <!-- CONFIGURACIÓN DE HORARIOS -->
  <section class="panel-admin" id="tab-horarios">
    <p style="color:var(--gris); margin-bottom:20px;">Definí qué días y en qué franja horaria se pueden reservar turnos. Los turnos se generan automáticamente según el intervalo que elijas.</p>
    <div id="horariosConfigForm"></div>
    <button class="btn btn-primario" id="btnGuardarHorarios" style="margin-top:16px;">Guardar configuración</button>
    <div id="horariosMsg"></div>
  </section>
</div>

<script src="js/admin.js"></script>
</body>
</html>
